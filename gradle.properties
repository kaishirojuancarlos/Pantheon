# Pantheon Project Configuration Properties
# ============================================
#
# This file contains project-wide configuration properties used throughout the
# Gradle build scripts. These properties can be accessed via project.properties
# or System.getProperty() in build scripts.
#
# Usage in build.gradle.kts:
#   val micronautVersion = project.properties.get("micronautVersion")
#

# -----------------------------------------------------------------------------
# Micronaut Framework Configuration
# -----------------------------------------------------------------------------
# Version of Micronaut Framework to use across all modules
# This version should be synchronized with the plugin versions in build.gradle.kts
micronautVersion=5.1.3

# -----------------------------------------------------------------------------
# Kotlin Configuration
# -----------------------------------------------------------------------------
# Kotlin compiler and standard library version
# Must be compatible with the JVM toolchain version (25)
# Note: Individual modules may override this via libs.versions.toml
kotlinVersion=2.3.21

# -----------------------------------------------------------------------------
# Gradle Configuration
# -----------------------------------------------------------------------------
# Gradle daemon JVM arguments (configured in gradle/gradle-daemon-jvm.properties)
# For production use, consider adding:
#   org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
#
# Gradle caching and performance settings (configured in gradle.properties)
# For faster builds, consider:
#   org.gradle.caching=true
#   org.gradle.parallel=true
#   org.gradle.configureondemand=true
#

# -----------------------------------------------------------------------------
# Build Environment
# -----------------------------------------------------------------------------
# Uncomment to enable strict mode for dependency resolution
# org.gradle.dependency.verification=strict
#
# Uncomment to enable build scan for diagnostics
# buildScan.termsOfServiceUrl=https://gradle.com/terms-of-service
# buildScan.termsOfServiceAgree=yes
